# Active profiles configuration (Default is H2, toggle to mysql for MySQL)
spring.profiles.active=default

# Database Connection Settings (Local H2 Memory Database for testing)
spring.datasource.url=jdbc:h2:mem:securecryptdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Allows database inspection in-browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Secret configurations (256-bit secret key)
securecrypt.jwt.secret=YOUR_GENERATED_256BIT_SECRET_KEY
securecrypt.jwt.expiration-ms=86400000

# S3 and Local Simulated Storage configurations
aws.s3.enabled=false
aws.s3.bucket=YOUR_S3_BUCKET_NAME
aws.s3.region=YOUR_AWS_REGION
aws.s3.access-key=YOUR_AWS_ACCESS_KEY_ID
aws.s3.secret-key=YOUR_AWS_SECRET_ACCESS_KEY
storage.local.dir=data/s3-sim